<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Em Casa Hamburgueria · Gestão</title>
  <link rel="icon" href="img/logo-emcasa.jpg">
  <script>
    // Aplica o tema salvo antes de pintar a página (evita "piscar")
    try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#painel" aria-label="Em Casa Hamburgueria Artesanal - Painel">
        <span class="brand-logo" role="img" aria-hidden="true"></span>
        <span class="brand-text">
          <strong>Gestão</strong>
          <small>Piracicaba</small>
        </span>
      </a>
      <div class="topbar-right">
        <nav class="tabs" aria-label="Seções">
          <a href="#painel" data-tab="painel">Painel</a>
          <a href="#cardapio" data-tab="cardapio">Cardápio</a>
          <a href="#estoque" data-tab="estoque">Estoque</a>
          <a href="#movimentos" data-tab="movimentos">Movimentações</a>
        </nav>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Alternar modo claro/escuro" title="Alternar modo claro/escuro">
          <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="container" aria-live="polite"></main>

  <dialog id="modal" class="modal">
    <form method="dialog" id="modal-form" novalidate>
      <header class="modal-head">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button>
      </header>
      <div id="modal-body" class="modal-body"></div>
      <p id="modal-error" class="form-error" role="alert" hidden></p>
      <footer class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="modal-submit">Salvar</button>
      </footer>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
